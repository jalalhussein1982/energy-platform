# Thin wrapper over Make (ADR-015). The scheduled drills of ADR-016 §6 / ADR-025 §5 on a kind
# cluster in CI: local profile up, rollback drill (failing smoke, failing storage probe), down.
# Never on pull requests: it takes ~15 minutes and needs the internet for the egress test.
name: weekly-drills

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make ci-bootstrap
      - run: make ci-kind-tools
      - run: make local-up
      - run: make rollback-drill
      - run: make local-down
