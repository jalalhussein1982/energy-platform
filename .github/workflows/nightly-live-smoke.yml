# Nightly live smoke (ADR-020): one bounded read per committed target, shape only. Never runs on
# pull requests; a failure is a source-shape change to look at, not a merge blocker. Thin wrapper
# over Make (ADR-015): every step is `make <target>`.
name: nightly-live-smoke

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC, after the OTE daily files are complete (docs/06 §3.3)
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make ci-bootstrap
      - run: make live-smoke
