# Demo environment (ADR-028): the Hetzner k3s cluster built by roots/hcloud, deployed with
# TENANT values into the namespace-scoped Role (proves the tenant contract on the own-cluster
# path). Layer on top of values-tenant.yaml: `make deploy-tenant ENV=demo`.
# Residency is declared honestly: DE for the cluster and both stores (ADR-028 §4, ADR-036 §6).
residency: DE
image:
  # The package ghcr.io/<owner>/energy-platform is private (the repository is): the author creates
  # this docker-registry Secret in the namespace from a classic PAT with read:packages only
  # (`make print-demo-secret-template`; plan P5-D21).
  pullSecrets: [ghcr-pull]
postgres:
  mode: statefulset
  storageClassName: local-path          # k3s default provisioner, backed by the Postgres volume
  # local-path creates the volume on whichever node the pod lands on, and only the server has the
  # 10 GB Hetzner volume mounted under the provisioner root (roots/hcloud): pin Postgres there.
  # 2026-09-23: without it the first deploy put Postgres on the agent's root disk.
  nodeSelector:
    kubernetes.io/hostname: energy-platform-demo-server
  size: 8Gi
  walArchive:
    size: 2Gi
  backup:
    enabled: true
    baseSchedule: "15 2 * * *"          # ADR-036 amendment 1: one base a day
    walSchedule: "*/10 * * * *"         # RPO 15 min with archive_timeout 300
    walStaleAfterSeconds: 1800
    baseStaleAfterSeconds: 172800
bronze:
  endpoint: https://nbg1.your-objectstorage.com        # store A (V-12)
  bucket: energy-platform-bronze                       # roots/hcloud output bucket_a
  region: nbg1
  retention:
    mode: COMPLIANCE                                   # the store-A control (V-12)
    days: 90
  tiering:
    mode: none                                         # never lifecycle on this gateway (V-12)
  replica:
    enabled: true
    # OCI S3-compatible endpoint https://<namespace>.compat.objectstorage.eu-frankfurt-1.oraclecloud.com.
    # The namespace (`oci os ns get`) is a tenancy identifier the repository does not carry:
    # `make deploy-tenant ENV=demo` builds the endpoint from DEMO_OCI_NAMESPACE (a GitHub
    # repository variable in the deploy workflow). Left empty here, the render fails loudly.
    endpoint: ""
    bucket: energy-platform-bronze-replica             # roots/hcloud output bucket_b (retention rule, V-13)
    region: eu-frankfurt-1
    # ADR-036 amendment 2: the independent copy follows the 15-minute capture cadence, seven
    # minutes after each capture instant (the `check --min-age 5m` then covers that capture);
    # RPO for a store-A loss = 15 min + copy time
    schedule: "7,22,37,52 * * * *"
    staleAfterSeconds: 2700
secrets:
  existingSecret: energy-platform                      # created by the author from the Terraform outputs
metrics:
  enabled: true
  operator:
    enabled: false
grafana:
  enabled: true                       # ADR-039: private dashboards; the Secret carries GRAFANA_ADMIN_PASSWORD / GRAFANA_DB_PASSWORD (added 2026-09-24)
alerting:
  enabled: true                       # ADR-040 (review 3 R3): the rules evaluated on the demo, delivered to the platform receiver
  kubeStateMetrics:
    rbac:
      create: false                     # the OIDC deploy identity may not manage Roles (ADR-035 amendment 1): the author
                                        # applied deployment/tenant/demo-kube-state-metrics-rbac.yaml once with the admin kubeconfig
    apiServer:
      # the `kubernetes` Service IP (k3s service-cidr 10.43.0.0/16) and the k3s server on the private
      # network = `kubectl get endpoints kubernetes` → 10.10.1.10:6443 (read 2026-09-25)
      cidrs: [10.43.0.1/32, 10.10.1.10/32]
      ports: [443, 6443]
  # a real channel is the author's values change: alerting.alertmanager.receivers/routes + egress.cidrs
egress:
  # k3s kube-router applies a new pod's policy asynchronously (measured 2026-09-23: the
  # metadata service answered a fresh pod, refused it 15 s later): gate every platform pod (05 C-65)
  policyGate:
    enabled: true
  clusterCIDRs: [10.42.0.0/16, 10.43.0.0/16]           # k3s cluster-cidr / service-cidr (cloud-init)
  objectStore:
    # Object-store endpoints are public addresses: capture pods reach them through the 443 rule
    # already (public ranges); process/gaps/hook/drill/backup/replicate pods need this explicit
    # rule (plan P5-D22, provider facts as of 2026-09-23):
    # - store A: nbg1.your-objectstorage.com resolves to 88.198.120.0, RIPE netblock
    #   88.198.120.0/25 (maintained by Hetzner, mnt-by HOS-GUN);
    # - store B: Oracle's public_ip_ranges.json, tag OBJECT_STORAGE, region eu-frankfurt-1
    #   (https://docs.oracle.com/en-us/iaas/tools/public_ip_ranges.json).
    # A provider renumbering shows up as failing process/backup Jobs, never as silent loss.
    cidrs: [88.198.120.0/25, 134.70.40.0/21, 134.70.48.0/22]
    ports: [443]
smoke:
  manifest: ote_intraday_market/manifest.yaml
  fixture: ote_intraday_market/fixtures/ordinary_day
drills:
  restore:
    enabled: true
    schedule: "30 3 * * *"
