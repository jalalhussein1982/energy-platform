# Cilium for the local kind cluster — the policy-enforcing CNI ADR-026 §4 requires. The chart
# pins its own images by digest (image.useDigest). Sized for a laptop; Hubble off.
policyEnforcementMode: default        # enforce every NetworkPolicy the chart declares
kubeProxyReplacement: false
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: kubernetes
image:
  useDigest: true
operator:
  replicas: 1
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
resources:
  requests: {cpu: 50m, memory: 192Mi}
  limits: {cpu: "1", memory: 512Mi}
hubble:
  enabled: false
envoy:
  enabled: false
