{{- /*
ADR-039 (Phase 11): Grafana as a private window onto Silver. Off by default. When on:
  - a ConfigMap-provisioned PostgreSQL datasource using the read-only login role the migrate
    hook creates (`energyctl migrate --reader-user grafana`, password GRAFANA_DB_PASSWORD from
    the namespace Secret); Grafana never holds the application's credentials;
  - two ConfigMap-provisioned dashboards from this chart's dashboards/ directory, read-only
    (the data directory is an emptyDir: nothing edited in the UI survives a restart, by design);
  - a ClusterIP Service on 3000 and NetworkPolicies: egress to Postgres and DNS only, ingress
    from the namespace only. Access is `kubectl port-forward` (docs/07 §7.1). No Ingress, no
    LoadBalancer: the sources allow internal use only (06 §1.4, §4.5).
  - image by digest, uid 472, read-only root filesystem, telemetry and update checks off.
*/ -}}
{{- if .Values.grafana.enabled }}
{{- $fullname := include "energy-platform.fullname" . }}
{{- $sslmode := ternary "disable" "require" (eq .Values.postgres.mode "statefulset") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-provisioning
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: energy-platform Silver
        uid: energy-postgres
        type: grafana-postgresql-datasource
        access: proxy
        isDefault: true
        editable: false
{{- if eq .Values.postgres.mode "statefulset" }}
        url: {{ printf "%s-postgres:5432" $fullname | quote }}
        user: {{ .Values.grafana.readerUser | quote }}
        jsonData:
          database: {{ .Values.postgres.database | quote }}
          sslmode: {{ $sslmode | quote }}
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $GRAFANA_DB_PASSWORD
{{- else }}
        url: {{ required "grafana.datasource.host is required outside statefulset mode (host:port)" .Values.grafana.datasource.host | quote }}
        user: {{ .Values.grafana.readerUser | quote }}
        jsonData:
          database: {{ required "grafana.datasource.database is required outside statefulset mode" .Values.grafana.datasource.database | quote }}
          sslmode: {{ $sslmode | quote }}
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $GRAFANA_DB_PASSWORD
{{- end }}
{{- if .Values.alerting.enabled }}
      # ADR-040: the evaluator's metrics, for the ADR-037 freshness dashboard
      - name: energy-platform Prometheus
        uid: energy-prometheus
        type: prometheus
        access: proxy
        editable: false
        url: {{ printf "http://%s-prometheus:9090" $fullname | quote }}
{{- end }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: energy-platform
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dashboards
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
data:
  prices.json: |
{{ .Files.Get "dashboards/prices.json" | indent 4 }}
  freshness-sql.json: |
{{ .Files.Get "dashboards/freshness-sql.json" | indent 4 }}
{{- if .Values.alerting.enabled }}
  freshness.json: |
{{ .Files.Get "dashboards/freshness.json" | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: grafana
spec:
  type: ClusterIP
  selector:
{{ include "energy-platform.selectorLabels" . | indent 4 }}
    energy-platform.io/role: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "energy-platform.selectorLabels" . | indent 6 }}
      energy-platform.io/role: grafana
  template:
    metadata:
      labels:
{{ include "energy-platform.selectorLabels" . | indent 8 }}
        energy-platform.io/role: grafana
      annotations:
        checksum/dashboards: {{ print (.Files.Get "dashboards/prices.json") (.Files.Get "dashboards/freshness-sql.json") (.Files.Get "dashboards/freshness.json") .Values.postgres.mode .Values.grafana.readerUser .Values.alerting.enabled | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 472) | indent 8 }}
      containers:
        - name: grafana
          image: {{ include "energy-platform.thirdPartyImage" .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: GRAFANA_DB_PASSWORD
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000/
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/log
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 3000
          securityContext:
{{ include "energy-platform.containerSecurity" . | indent 12 }}
          resources:
{{ toYaml .Values.resources.grafana | indent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provisioning-datasources
          configMap:
            name: {{ $fullname }}-grafana-provisioning
            items:
              - key: datasource.yaml
                path: datasource.yaml
        - name: provisioning-dashboards
          configMap:
            name: {{ $fullname }}-grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: {{ $fullname }}-grafana-dashboards
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-grafana-ingress
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "energy-platform.selectorLabels" . | indent 6 }}
      energy-platform.io/role: grafana
  policyTypes: [Ingress]
  ingress:
    # the namespace only: port-forward traffic enters from the node, which every CNI admits for
    # kubelet-originated connections; nothing from other namespaces, nothing from outside
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
