{{- /*
D-7: plain Secret by default — the Secret named secrets.existingSecret must exist before install
(keys: {{ include "energy-platform.secretKeys" . }}). Only with secrets.eso.enabled does the chart
render an ExternalSecret (a CRD; never in the tenant default render).
*/ -}}
{{- if .Values.secrets.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.eso.storeRef.name is required with eso.enabled" .Values.secrets.eso.storeRef.name }}
    kind: {{ .Values.secrets.eso.storeRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
{{- range $key, $remote := .Values.secrets.eso.remoteKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
{{- end }}
{{- end }}
