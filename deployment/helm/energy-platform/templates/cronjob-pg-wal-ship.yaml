{{- /*
ADR-036 amendment 1: the WAL archive leaves the wal-archive volume only once it is in store A.
`rclone move --immutable --checksum` uploads each compressed segment to
<backupPrefix>/<system identifier>/wal/ (§6: the init container asks Postgres which cluster it is) and
deletes the local file after the upload (or when an identical object is already there); an
object that differs at the same key fails the Job instead of being overwritten. `*.part` files
are segments archive_command is still writing; lost+found exists on block-device volumes and is
not ours. RPO = archive_timeout (5 min) + walSchedule. The pod is pinned next to the Postgres pod
because the wal-archive claim is ReadWriteOnce.
ADR-036 amendment 6: every segment is touched before the move, so the modtime rclone stores with
the object (and preserves on the copy to B) is the shipment instant, not the instant
archive_command wrote the .gz up to walSchedule earlier — the replication check's
`--min-age 5m` guard ages objects by that modtime and must see when the segment landed on A.
*/ -}}
{{- if and (eq .Values.postgres.mode "statefulset") .Values.postgres.backup.enabled }}
{{- $fullname := include "energy-platform.fullname" . -}}
{{- $script := printf "SYSID=$(cat /work/SYSTEM_ID)\nfind /wal-archive -maxdepth 1 -name '*.gz' | while read -r f; do touch \"$f\"; done\nrclone move /wal-archive A:%s/%s/$SYSID/wal/ --immutable --checksum --exclude '*.part' --exclude 'lost+found/**' --s3-no-check-bucket --stats-one-line -v\necho \"pg-wal-ship: shipped to A:%s/%s/$SYSID/wal/; $(find /wal-archive -maxdepth 1 -name '*.gz' | wc -l) segments left on the volume\"" .Values.bronze.bucket .Values.bronze.backupPrefix .Values.bronze.bucket .Values.bronze.backupPrefix -}}
{{- $env := include "energy-platform.rcloneEnv" (dict "root" . "alias" "A" "store" .Values.bronze "secret" "BRONZE") -}}
{{- $mounts := list (dict "name" "wal-archive" "mountPath" "/wal-archive") (dict "name" "work" "mountPath" "/work" "readOnly" true) -}}
{{- $container := include "energy-platform.rcloneContainer" (dict "root" . "name" "ship" "script" $script "env" $env "mounts" $mounts) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-pg-wal-ship
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: backup
spec:
  schedule: {{ .Values.postgres.backup.walSchedule | quote }}
  timeZone: {{ .Values.schedule.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.schedule.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.schedule.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
{{ include "energy-platform.selectorLabels" . | indent 12 }}
            energy-platform.io/role: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $fullname }}
          automountServiceAccountToken: false
          securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 999) | indent 12 }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
{{ include "energy-platform.selectorLabels" . | indent 22 }}
                      energy-platform.io/role: postgres
          initContainers:
            - name: system-id
              image: {{ include "energy-platform.thirdPartyImage" .Values.postgres.image }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
{{ include "energy-platform.systemIdScript" (dict "root" . "out" "/work/SYSTEM_ID") | indent 18 }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: POSTGRES_PASSWORD
                - name: HOME
                  value: /tmp
              securityContext:
{{ include "energy-platform.containerSecurity" . | indent 16 }}
              resources:
{{ toYaml .Values.resources.job | indent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          containers:
{{ $container | indent 12 }}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: work
              emptyDir: {}
            - name: wal-archive
              persistentVolumeClaim:
                claimName: {{ $fullname }}-postgres-wal-archive
{{- end }}
