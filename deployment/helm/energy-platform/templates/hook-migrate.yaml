{{- /*
ADR-025 hook chain, weight -10: Alembic upgrade to head on first install (post-install, after
the database is ready under --wait) and before a new image (pre-upgrade). Every migration is
expand/contract and compatible with code N-1 (ADR-016 §3), so an automatic rollback leaves a
schema the previous image accepts.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "energy-platform.fullname" . }}-migrate
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: hook
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
{{- /* ADR-039: with grafana on, the hook also creates or rotates the read-only login role from
     the Secret's GRAFANA_DB_PASSWORD (migration 0007 made the group role) */ -}}
{{- $args := list "migrate" -}}
{{- $extra := list -}}
{{- if .Values.grafana.enabled }}
{{- $args = list "migrate" "--reader-user" .Values.grafana.readerUser -}}
{{- $extra = list (dict "name" "GRAFANA_DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.secrets.existingSecret "key" "GRAFANA_DB_PASSWORD"))) -}}
{{- end }}
  template:
{{ include "energy-platform.podTemplate" (dict "root" . "role" "hook" "container" (include "energy-platform.container" (dict "root" . "name" "migrate" "args" $args "extraEnv" $extra))) | indent 4 }}
