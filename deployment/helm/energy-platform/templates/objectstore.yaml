{{- /*
objectstore.local.enabled: two S3 servers for the local profile (ADR-036 §1, amendment 4) —
store A with versioning and bucket Object Lock (the store-A control; the platform puts
COMPLIANCE retention headers on every PUT), store B plain (the copy target, written by
replicate only). RustFS since 2026-09-24: MinIO's community images were withdrawn (docs/07 §8.3);
the server was chosen by the probe recorded in docs/07 §8.4 — SigV4 path-style, versioning,
Object Lock with per-object retention, ListObjectsV2 paging, storage-class round trip,
If-None-Match, rclone --immutable all verified. Root credentials are the BRONZE / BRONZE_REPLICA
keys of the existing Secret, so the platform pods and the servers agree without a second secret.
The image runs as uid 10001 natively; the console port is disabled; logs go to an emptyDir.
*/ -}}
{{- if .Values.objectstore.local.enabled }}
{{- $root := . -}}
{{- range $store := list (dict "suffix" "a" "secret" "BRONZE") (dict "suffix" "b" "secret" "BRONZE_REPLICA") }}
{{- $name := printf "%s-minio-%s" (include "energy-platform.fullname" $root) $store.suffix }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
{{ include "energy-platform.labels" $root | indent 4 }}
spec:
  selector:
{{ include "energy-platform.selectorLabels" $root | indent 4 }}
    energy-platform.io/role: objectstore
    energy-platform.io/store: {{ $store.suffix }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
{{ include "energy-platform.labels" $root | indent 4 }}
    energy-platform.io/role: objectstore
    energy-platform.io/store: {{ $store.suffix }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
{{ include "energy-platform.selectorLabels" $root | indent 6 }}
      energy-platform.io/role: objectstore
      energy-platform.io/store: {{ $store.suffix }}
  template:
    metadata:
      labels:
{{ include "energy-platform.selectorLabels" $root | indent 8 }}
        energy-platform.io/role: objectstore
        energy-platform.io/store: {{ $store.suffix }}
    spec:
      serviceAccountName: {{ include "energy-platform.fullname" $root }}
      automountServiceAccountToken: false
      securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 10001) | indent 8 }}
      containers:
        - name: objectstore
          image: {{ include "energy-platform.thirdPartyImage" $root.Values.objectstore.local.image }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $store.secret }}_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $store.secret }}_SECRET_ACCESS_KEY
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /tmp/logs
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: warn
            - name: HOME
              value: /tmp
          ports:
            - name: s3
              containerPort: 9000
          securityContext:
{{ include "energy-platform.containerSecurity" $root | indent 12 }}
          resources:
{{ toYaml $root.Values.resources.objectstore | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if $root.Values.postgres.storageClassName }}
        storageClassName: {{ $root.Values.postgres.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ $root.Values.objectstore.local.size }}
{{- end }}
{{- end }}
