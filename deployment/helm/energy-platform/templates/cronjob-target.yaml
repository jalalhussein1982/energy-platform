{{- /*
ADR-003 rev.: ONE template, rendered once per target from targets/<id>/manifest.yaml (the values
come from scripts/render_target_values.py at deploy time, P5-D3). Per target: capture (live
fetch, 443 egress), process (no internet), and — when the manifest declares
cadence.correction — recapture (ADR-033 §3), and backfill (ADR-024 §5: the gap detector's
missing_capture runs, at most schedule.backfill.limit fetches per firing so a fresh deploy
never floods a source). process runs process_cron = the cadence shifted by a few minutes so it
never races the capture of the same instant. concurrencyPolicy: Forbid = at most one in-flight
request per target (ADR-033 §2); startingDeadlineSeconds and activeDeadlineSeconds bound a
missed or stuck run; the ledger supplies idempotency and missed-run detection. The capture
container receives its Job name (ENERGY_PLATFORM_JOB_NAME): the run's instant is the
controller's tick, not the pod's start time (ADR-031 amendment 1).
*/ -}}
{{- $root := . -}}
{{- range .Values.targets }}
{{- $target := . -}}
{{- $manifest := printf "/app/targets/%s" .manifest -}}
{{- $jitter := toString $root.Values.schedule.startJitterSeconds -}}
{{- /* ADR-031 amendment 1 (review 3 R2): the capture verb keys its run by the CronJob
     controller's own tick, carried in the Job name (`<cronjob>-<minutes since the epoch>`);
     the downward API hands the pod's job-name label to the container */ -}}
{{- $jobName := list (dict "name" "ENERGY_PLATFORM_JOB_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.labels['batch.kubernetes.io/job-name']"))) -}}
{{- $jobs := list
      (dict "verb" "capture" "role" "capture" "cron" .cron "extraEnv" $jobName
            "args" (list "capture" "-m" $manifest "--live" "--start-jitter-seconds" $jitter))
      (dict "verb" "process" "role" "process" "cron" (default .cron .process_cron)
            "args" (list "process" "-m" $manifest))
      (dict "verb" "backfill" "role" "backfill" "cron" $root.Values.schedule.backfill.cron
            "args" (list "backfill" "-m" $manifest "--live" "--limit" (toString $root.Values.schedule.backfill.limit))) -}}
{{- if .correction }}
{{- $jobs = append $jobs (dict "verb" "recapture" "role" "recapture" "cron" .correction.cron
      "args" (list "recapture" "-m" $manifest "--days" (toString .correction.days) "--live" "--start-jitter-seconds" $jitter)) -}}
{{- end }}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s-%s" (include "energy-platform.fullname" $root) .verb ($target.id | replace "_" "-") | trunc 52 | trimSuffix "-" }}
  labels:
{{ include "energy-platform.labels" $root | indent 4 }}
    energy-platform.io/role: {{ .role }}
    energy-platform.io/target: {{ $target.id }}
spec:
  schedule: {{ .cron | quote }}
  timeZone: {{ $target.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $root.Values.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $root.Values.schedule.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.schedule.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $root.Values.schedule.activeDeadlineSeconds }}
      template:
{{ include "energy-platform.podTemplate" (dict "root" $root "role" .role "target" $target.id "container" (include "energy-platform.container" (dict "root" $root "name" .verb "args" .args "extraEnv" .extraEnv))) | indent 8 }}
{{- end }}
{{- end }}
