{{- /*
ADR-036 §4 as amended (amendment 1), postgres.mode=statefulset: base backup + continuous WAL
archive = PITR without a custom Postgres image. This CronJob takes the BASE only
(postgres.backup.baseSchedule, daily by default): init container pg_basebackup (tar, gzip, WAL
streamed into the backup so it is self-consistent) into an emptyDir, plus a START_WAL marker read
from backup_label (the restore drill fetches only the archived WAL from that segment on);
container: rclone ships it under <backupPrefix>/<system identifier>/base/<timestamp>/ with
--immutable (§6: a re-initialised cluster never writes into an earlier one's locked keys). The WAL
archive is shipped by pg-wal-ship; the replication job mirrors the prefix to B.
*/ -}}
{{- if and (eq .Values.postgres.mode "statefulset") .Values.postgres.backup.enabled }}
{{- if hasKey .Values.postgres.backup "schedule" }}
{{- fail "postgres.backup.schedule was replaced by postgres.backup.baseSchedule and postgres.backup.walSchedule (ADR-036 amendment 1)" }}
{{- end }}
{{- $fullname := include "energy-platform.fullname" . -}}
{{- $script := printf "STAMP=$(date -u +%%Y%%m%%dT%%H%%M%%SZ); SYSID=$(cat /backup/base/SYSTEM_ID)\nrclone copy /backup/base A:%s/%s/$SYSID/base/$STAMP/ --immutable --s3-no-check-bucket --stats-one-line -v\necho \"pg-backup: cluster $SYSID base $STAMP (WAL from $(cat /backup/base/START_WAL)) shipped to A:%s/%s/$SYSID/base/\"" .Values.bronze.bucket .Values.bronze.backupPrefix .Values.bronze.bucket .Values.bronze.backupPrefix -}}
{{- $env := include "energy-platform.rcloneEnv" (dict "root" . "alias" "A" "store" .Values.bronze "secret" "BRONZE") -}}
{{- $mounts := list (dict "name" "backup" "mountPath" "/backup" "readOnly" true) -}}
{{- $container := include "energy-platform.rcloneContainer" (dict "root" . "name" "ship" "script" $script "env" $env "mounts" $mounts) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-pg-backup
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: backup
spec:
  schedule: {{ .Values.postgres.backup.baseSchedule | quote }}
  timeZone: {{ .Values.schedule.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.schedule.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.schedule.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
{{ include "energy-platform.selectorLabels" . | indent 12 }}
            energy-platform.io/role: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $fullname }}
          automountServiceAccountToken: false
          securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 999) | indent 12 }}
          initContainers:
            - name: pg-basebackup
              image: {{ include "energy-platform.thirdPartyImage" .Values.postgres.image }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
{{ include "energy-platform.waitForPostgres" . | indent 18 }}
                  pg_basebackup -h {{ $fullname }}-postgres -U {{ .Values.postgres.user }} -D /backup/base -Ft -z -X stream --checkpoint=fast --no-password -v
{{ include "energy-platform.systemIdScript" (dict "root" . "out" "/backup/base/SYSTEM_ID") | indent 18 }}
                  tar -xzOf /backup/base/base.tar.gz backup_label | sed -n 's/^START WAL LOCATION: .* (file \([0-9A-F]\{24\}\))$/\1/p' > /backup/base/START_WAL
                  test -s /backup/base/START_WAL
                  echo "pg-backup: base taken, WAL from $(cat /backup/base/START_WAL)"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: POSTGRES_PASSWORD
                - name: HOME
                  value: /tmp
              securityContext:
{{ include "energy-platform.containerSecurity" . | indent 16 }}
              resources:
{{ toYaml .Values.resources.job | indent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          containers:
{{ $container | indent 12 }}
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
