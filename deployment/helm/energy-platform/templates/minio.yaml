{{- /*
objectstore.local.enabled: two MinIOs for the local profile (ADR-036 §1) — store A as a
single-node multi-drive server (four paths on one volume: erasure coding, which Object Lock
requires) and store B plain. Root credentials are the BRONZE / BRONZE_REPLICA keys of the
existing Secret, so the platform pods and MinIO agree without a second secret.
*/ -}}
{{- if .Values.objectstore.local.enabled }}
{{- $root := . -}}
{{- range $store := list (dict "suffix" "a" "secret" "BRONZE" "drives" "/data/disk{1...4}" "lock" true) (dict "suffix" "b" "secret" "BRONZE_REPLICA" "drives" "/data/disk1" "lock" false) }}
{{- $name := printf "%s-minio-%s" (include "energy-platform.fullname" $root) $store.suffix }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
{{ include "energy-platform.labels" $root | indent 4 }}
spec:
  selector:
{{ include "energy-platform.selectorLabels" $root | indent 4 }}
    energy-platform.io/role: objectstore
    energy-platform.io/store: {{ $store.suffix }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
{{ include "energy-platform.labels" $root | indent 4 }}
    energy-platform.io/role: objectstore
    energy-platform.io/store: {{ $store.suffix }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
{{ include "energy-platform.selectorLabels" $root | indent 6 }}
      energy-platform.io/role: objectstore
      energy-platform.io/store: {{ $store.suffix }}
  template:
    metadata:
      labels:
{{ include "energy-platform.selectorLabels" $root | indent 8 }}
        energy-platform.io/role: objectstore
        energy-platform.io/store: {{ $store.suffix }}
    spec:
      serviceAccountName: {{ include "energy-platform.fullname" $root }}
      automountServiceAccountToken: false
      securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 10001) | indent 8 }}
      containers:
        - name: minio
          image: {{ include "energy-platform.thirdPartyImage" $root.Values.objectstore.local.image }}
          args: ["server", {{ $store.drives | quote }}, "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $store.secret }}_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $store.secret }}_SECRET_ACCESS_KEY
            - name: MINIO_UPDATE
              value: "off"
            - name: HOME
              value: /tmp
          ports:
            - name: s3
              containerPort: 9000
          securityContext:
{{ include "energy-platform.containerSecurity" $root | indent 12 }}
          resources:
{{ toYaml $root.Values.resources.minio | indent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if $root.Values.postgres.storageClassName }}
        storageClassName: {{ $root.Values.postgres.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ $root.Values.objectstore.local.size }}
{{- end }}
{{- end }}
