{{- /*
ADR-002 restore drill / ADR-036 §5 / ADR-024 §2 / ADR-021 §5 — a backup that has never been
restored is a hypothesis. Every run:
  1. fetch  (rclone)   newest base backup + the archived WAL from its START_WAL on, from STORE B
                       (the independent copy; ADR-036 amendment 1);
  2. prep   (postgres) untar base + pg_wal into a scratch PGDATA, recovery.signal,
                       restore_command from the fetched archive (PITR to the end of the archive);
  3. scratch-postgres  a native sidecar (init container, restartPolicy Always) serving the
                       restored cluster on 127.0.0.1 — started only after prep, and the drill
                       waits for its startupProbe;
  4. drill  (platform) `energyctl restore-drill` twice: against the RESTORED database
                       (proves the backups), then into a fresh schema of the same scratch
                       server with --scratch-schema rebuild (proves the Bronze-only ledger
                       rebuild: reconcile over the full replica history + replay from B).
       Both compare processed runs and a Silver checksum with the live database; any
       difference fails the Job (a failed Job is the alert). Wall clock is the RTO figure.
`RESTORE_DRILL_ARGS` (default empty) lets `make smoke-test` run the dry-run variant.
*/ -}}
{{- if .Values.drills.restore.enabled }}
{{- if ne .Values.postgres.mode "statefulset" }}
{{- fail (printf "drills.restore.enabled needs postgres.mode=statefulset: the drill restores the chart's own base + WAL chain (ADR-036 §4-§5) and mode %q has no backup chain it can read yet (ADR-036 amendment 3, review 2 DEP-02) — set drills.restore.enabled=false, or use statefulset" .Values.postgres.mode) }}
{{- end }}
{{- $fullname := include "energy-platform.fullname" . -}}
{{- $b := printf "B:%s/%s" .Values.bronze.replica.bucket .Values.bronze.backupPrefix -}}
{{- /* ADR-036 amendment 1: the newest base across clusters (<backupPrefix>/<system identifier>/
base/<stamp>, §6) and only that cluster's archived WAL at or after the base's START_WAL
(string comparison: segment names sort in LSN order within a timeline). An absent wal/ prefix
is an empty archive. */ -}}
{{- $fetch := `NEWEST=$(rclone lsf -R @B@/ --dirs-only --max-depth 3 2>/dev/null | grep -E '^[0-9]+/base/[0-9]{8}T[0-9]{6}Z/$' | awk -F/ '{ print $3 " " $1 }' | sort | tail -1)
if [ -z "$NEWEST" ]; then
  case " $RESTORE_DRILL_ARGS " in *" --dry-run "*) echo "restore-drill: dry run — no base backup under @B@/ yet; the scratch cluster will start empty"; exit 0;; esac
  echo "restore-drill: no base backup under @B@/ yet"; exit 1
fi
LATEST=${NEWEST% *}; SYSID=${NEWEST#* }
rclone copy "@B@/$SYSID/base/$LATEST" /restore/base --stats-one-line -v
START=$(cat /restore/base/START_WAL 2>/dev/null || true)
if ! rclone lsf "@B@/$SYSID/wal/" --files-only > /restore/wal-all.list 2> /restore/lsf.err; then
  grep -q "directory not found" /restore/lsf.err || { cat /restore/lsf.err; exit 1; }
fi
awk -v s="$START" '{ n = $0; sub(/\.gz$/, "", n); if (s == "" || (n "") >= (s "")) print }' /restore/wal-all.list > /restore/wal.list
rclone copy "@B@/$SYSID/wal" /restore/wal --files-from /restore/wal.list --no-traverse --stats-one-line -v
echo "restore-drill: fetched cluster $SYSID base $LATEST and $(wc -l < /restore/wal.list) of $(wc -l < /restore/wal-all.list) archived WAL files (from ${START:-the beginning}) from store B"` | replace "@B@" $b -}}
{{- $fetchEnv := printf "%s\n- name: RESTORE_DRILL_ARGS\n  value: \"\"" (include "energy-platform.rcloneEnv" (dict "root" . "alias" "B" "store" .Values.bronze.replica "secret" "BRONZE_REPLICA")) -}}
{{- $fetchMounts := list (dict "name" "restore" "mountPath" "/restore") -}}
{{- $fetchContainer := include "energy-platform.rcloneContainer" (dict "root" . "name" "fetch" "script" $fetch "env" $fetchEnv "mounts" $fetchMounts) -}}
{{- $replicaEnv := include "energy-platform.s3Env" (dict "root" . "prefix" "ENERGY_PLATFORM_S3_REPLICA" "secret" "BRONZE_REPLICA" "store" .Values.bronze.replica) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-restore-drill
  labels:
{{ include "energy-platform.labels" . | indent 4 }}
    energy-platform.io/role: drill
spec:
  schedule: {{ .Values.drills.restore.schedule | quote }}
  timeZone: {{ .Values.schedule.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # both phases plus the fetch and the restore share this budget; the replay is CPU-bound and
      # grows with the captured history (2026-09-25: 944 s for phase 1 alone at revision 27)
      activeDeadlineSeconds: {{ .Values.drills.restore.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
{{ include "energy-platform.selectorLabels" . | indent 12 }}
            energy-platform.io/role: drill
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $fullname }}
          automountServiceAccountToken: false
{{- with include "energy-platform.imagePullSecrets" . }}
{{ . | indent 10 }}
{{- end }}
          # uid 999 = the postgres image's user: initdb and postgres need their uid in /etc/passwd;
          # rclone and the platform image run as any non-root uid
          securityContext:
{{ include "energy-platform.podSecurity" (dict "uid" 999) | indent 12 }}
          initContainers:
{{ $fetchContainer | indent 12 }}
            - name: prep
              image: {{ include "energy-platform.thirdPartyImage" .Values.postgres.image }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  if [ ! -f /restore/base/base.tar.gz ]; then
                    # dry run on a cluster with no backup yet: an empty scratch cluster so the
                    # drill verb can still reach a server (the fetch step said why)
                    initdb -U {{ .Values.postgres.user }} --auth=trust -D /restore/pgdata >/dev/null
                    printf "listen_addresses = '127.0.0.1'\nunix_socket_directories = '/var/run/postgresql'\n" >> /restore/pgdata/postgresql.auto.conf
                    printf 'local all all trust\nhost all all 127.0.0.1/32 trust\n' > /restore/pgdata/pg_hba.conf
                    echo "restore-drill: empty scratch cluster initialised (nothing to restore yet)"
                    exit 0
                  fi
                  mkdir -p /restore/pgdata /restore/pgdata/pg_wal
                  tar -xzf /restore/base/base.tar.gz -C /restore/pgdata
                  tar -xzf /restore/base/pg_wal.tar.gz -C /restore/pgdata/pg_wal
                  rm -f /restore/pgdata/postmaster.pid /restore/pgdata/recovery.conf
                  chmod 0700 /restore/pgdata
                  cat >> /restore/pgdata/postgresql.auto.conf <<'EOF'
                  restore_command = 'if [ -f /restore/wal/%f.gz ]; then gzip -dc /restore/wal/%f.gz > %p; else cp /restore/wal/%f %p; fi'
                  archive_mode = off
                  listen_addresses = '127.0.0.1'
                  unix_socket_directories = '/var/run/postgresql'
                  EOF
                  printf 'local all all trust\nhost all all 127.0.0.1/32 scram-sha-256\nhost all all ::1/128 scram-sha-256\n' > /restore/pgdata/pg_hba.conf
                  touch /restore/pgdata/recovery.signal
                  echo "restore-drill: scratch PGDATA prepared for PITR to the end of the archive"
              securityContext:
{{ include "energy-platform.containerSecurity" . | indent 16 }}
              resources:
{{ toYaml .Values.resources.job | indent 16 }}
              volumeMounts:
                - name: restore
                  mountPath: /restore
                - name: tmp
                  mountPath: /tmp
            - name: scratch-postgres
              image: {{ include "energy-platform.thirdPartyImage" .Values.postgres.image }}
              restartPolicy: Always
              command: ["postgres", "-D", "/restore/pgdata"]
              env:
                - name: PGDATA
                  value: /restore/pgdata
              startupProbe:
                exec:
                  command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}]
                periodSeconds: 5
                failureThreshold: 120
              securityContext:
{{ include "energy-platform.containerSecurity" . | indent 16 }}
              resources:
{{ toYaml .Values.resources.postgres | indent 16 }}
              volumeMounts:
                - name: restore
                  mountPath: /restore
                - name: run
                  mountPath: /var/run/postgresql
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: drill
              image: {{ include "energy-platform.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  DB={{ .Values.postgres.database }}; case " $RESTORE_DRILL_ARGS " in *" --dry-run "*) [ -d /restore/base ] && [ -f /restore/base/base.tar.gz ] || DB=postgres;; esac
                  SCRATCH="postgresql://{{ .Values.postgres.user }}:$POSTGRES_PASSWORD@127.0.0.1:5432/$DB"
                  echo "== restore-drill: against the RESTORED database (backups)"
                  /app/.venv/bin/python -m energy_platform.cli restore-drill --scratch-dsn "$SCRATCH" $RESTORE_DRILL_ARGS
                  echo "== restore-drill: Bronze-only rebuild into a fresh schema (ADR-024 §2)"
                  /app/.venv/bin/python -m energy_platform.cli restore-drill --scratch-dsn "$SCRATCH" --scratch-schema rebuild $RESTORE_DRILL_ARGS
              env:
                - name: RESTORE_DRILL_ARGS
                  value: ""
{{ include "energy-platform.platformEnv" (dict "root" . "bronzeMode" "s3") | indent 16 }}
{{ $replicaEnv | indent 16 }}
              securityContext:
{{ include "energy-platform.containerSecurity" . | indent 16 }}
              resources:
{{ toYaml .Values.resources.drill | indent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: restore
                  mountPath: /restore
                  readOnly: true
          volumes:
            - name: restore
              emptyDir: {}
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
