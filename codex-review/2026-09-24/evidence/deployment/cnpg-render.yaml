# Source: energy-platform/templates/cronjob-restore-drill.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-energy-platform-restore-drill
  labels:
    helm.sh/chart: "energy-platform-0.5.0"
    app.kubernetes.io/name: energy-platform
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
    energy-platform.io/residency: "CZ"
    energy-platform.io/role: drill
spec:
  schedule: "30 3 * * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: energy-platform
            app.kubernetes.io/instance: audit
            energy-platform.io/role: drill
        spec:
          restartPolicy: Never
          serviceAccountName: audit-energy-platform
          automountServiceAccountToken: false
          # uid 999 = the postgres image's user: initdb and postgres need their uid in /etc/passwd;
          # rclone and the platform image run as any non-root uid
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: docker.io/rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  NEWEST=$(rclone lsf -R B:bronze-replica/backups/postgres/ --dirs-only --max-depth 3 2>/dev/null | grep -E '^[0-9]+/base/[0-9]{8}T[0-9]{6}Z/$' | awk -F/ '{ print $3 " " $1 }' | sort | tail -1)
                  if [ -z "$NEWEST" ]; then
                    case " $RESTORE_DRILL_ARGS " in *" --dry-run "*) echo "restore-drill: dry run — no base backup under B:bronze-replica/backups/postgres/ yet; the scratch cluster will start empty"; exit 0;; esac
                    echo "restore-drill: no base backup under B:bronze-replica/backups/postgres/ yet"; exit 1
                  fi
                  LATEST=${NEWEST% *}; SYSID=${NEWEST#* }
                  rclone copy "B:bronze-replica/backups/postgres/$SYSID/base/$LATEST" /restore/base --stats-one-line -v
                  START=$(cat /restore/base/START_WAL 2>/dev/null || true)
                  if ! rclone lsf "B:bronze-replica/backups/postgres/$SYSID/wal/" --files-only > /restore/wal-all.list 2> /restore/lsf.err; then
                    grep -q "directory not found" /restore/lsf.err || { cat /restore/lsf.err; exit 1; }
                  fi
                  awk -v s="$START" '{ n = $0; sub(/\.gz$/, "", n); if (s == "" || (n "") >= (s "")) print }' /restore/wal-all.list > /restore/wal.list
                  rclone copy "B:bronze-replica/backups/postgres/$SYSID/wal" /restore/wal --files-from /restore/wal.list --no-traverse --stats-one-line -v
                  echo "restore-drill: fetched cluster $SYSID base $LATEST and $(wc -l < /restore/wal.list) of $(wc -l < /restore/wal-all.list) archived WAL files (from ${START:-the beginning}) from store B"
              env:
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG_B_TYPE
                  value: s3
                - name: RCLONE_CONFIG_B_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_B_ENDPOINT
                  value: "https://s3b.example.internal"
                - name: RCLONE_CONFIG_B_REGION
                  value: "us-east-1"
                - name: RCLONE_CONFIG_B_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_B_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: energy-platform
                      key: BRONZE_REPLICA_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_B_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: energy-platform
                      key: BRONZE_REPLICA_SECRET_ACCESS_KEY
                - name: RESTORE_DRILL_ARGS
                  value: ""
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: restore
                  mountPath: /restore
            - name: prep
              image: docker.io/library/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  if [ ! -f /restore/base/base.tar.gz ]; then
                    # dry run on a cluster with no backup yet: an empty scratch cluster so the
                    # drill verb can still reach a server (the fetch step said why)
                    initdb -U energy --auth=trust -D /restore/pgdata >/dev/null
                    printf "listen_addresses = '127.0.0.1'\nunix_socket_directories = '/var/run/postgresql'\n" >> /restore/pgdata/postgresql.auto.conf
                    printf 'local all all trust\nhost all all 127.0.0.1/32 trust\n' > /restore/pgdata/pg_hba.conf
                    echo "restore-drill: empty scratch cluster initialised (nothing to restore yet)"
                    exit 0
                  fi
                  mkdir -p /restore/pgdata /restore/pgdata/pg_wal
                  tar -xzf /restore/base/base.tar.gz -C /restore/pgdata
                  tar -xzf /restore/base/pg_wal.tar.gz -C /restore/pgdata/pg_wal
                  rm -f /restore/pgdata/postmaster.pid /restore/pgdata/recovery.conf
                  chmod 0700 /restore/pgdata
                  cat >> /restore/pgdata/postgresql.auto.conf <<'EOF'
                  restore_command = 'if [ -f /restore/wal/%f.gz ]; then gzip -dc /restore/wal/%f.gz > %p; else cp /restore/wal/%f %p; fi'
                  archive_mode = off
                  listen_addresses = '127.0.0.1'
                  unix_socket_directories = '/var/run/postgresql'
                  EOF
                  printf 'local all all trust\nhost all all 127.0.0.1/32 scram-sha-256\nhost all all ::1/128 scram-sha-256\n' > /restore/pgdata/pg_hba.conf
                  touch /restore/pgdata/recovery.signal
                  echo "restore-drill: scratch PGDATA prepared for PITR to the end of the archive"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - name: restore
                  mountPath: /restore
                - name: tmp
                  mountPath: /tmp
            - name: scratch-postgres
              image: docker.io/library/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
