# Source: energy-platform/templates/metrics.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-energy-platform-metrics-queries
  labels:
    helm.sh/chart: "energy-platform-0.5.0"
    app.kubernetes.io/name: energy-platform
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
    energy-platform.io/residency: "CZ"
data:
  queries.yaml: |
    energy_platform_freshness:
      query: >-
        SELECT target_id AS target,
               EXTRACT(EPOCH FROM (now() - newest_delivery_start)) AS age_seconds,
               EXTRACT(EPOCH FROM (now() - computed_at)) AS computed_age_seconds
        FROM target_freshness
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - age_seconds: {usage: "GAUGE", description: "age of the newest observation (ADR-012 SLI)"}
        - computed_age_seconds: {usage: "GAUGE", description: "age of the freshness row itself"}
    energy_platform_freshness_status:
      query: >-
        SELECT f.target_id AS target, s.status,
               (f.status = s.status)::int AS active
        FROM target_freshness f
        CROSS JOIN (VALUES ('pending'), ('partial'), ('late'), ('complete')) AS s(status)
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - status: {usage: "LABEL", description: "pending | partial | late | complete (01 §5)"}
        - active: {usage: "GAUGE", description: "1 when this is the target's current state"}
    energy_platform_freshness_periods:
      query: >-
        SELECT target_id AS target, 'observed' AS kind, observed_periods AS count FROM target_freshness
        UNION ALL
        SELECT target_id AS target, 'expected' AS kind, expected_periods AS count FROM target_freshness
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - kind: {usage: "LABEL", description: "observed | expected"}
        - count: {usage: "GAUGE", description: "periods in the partition"}
    energy_platform:
      query: >-
        SELECT target_id AS target, source_unavailable::int AS source_unavailable,
               pipeline_failed::int AS pipeline_failed, stale_fetch_streak
        FROM target_freshness
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - source_unavailable: {usage: "GAUGE", description: "newest attempt failed in the fetch layer"}
        - pipeline_failed: {usage: "GAUGE", description: "newest attempt failed after Bronze"}
        - stale_fetch_streak: {usage: "GAUGE", description: "consecutive unchanged captures"}
    energy_platform_runs:
      query: >-
        SELECT target_id AS target, state, count(*) AS total FROM runs GROUP BY 1, 2
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - state: {usage: "LABEL", description: "ledger run state (ADR-024 §3)"}
        - total: {usage: "GAUGE", description: "runs in this state"}
    energy_platform_quality_events:
      query: >-
        SELECT target_id AS target, kind, count(*) AS last_hour FROM quality_events
        WHERE created_at > now() - interval '1 hour' AND kind <> 'partition_status' GROUP BY 1, 2
      metrics:
        - target: {usage: "LABEL", description: "target id"}
        - kind: {usage: "LABEL", description: "quality event kind (reconciliation_mismatch, …)"}
        - last_hour: {usage: "GAUGE", description: "quality events of this kind in the last hour"}

