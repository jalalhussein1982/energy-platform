# Source: energy-platform/templates/metrics.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-energy-platform-metrics
  labels:
    helm.sh/chart: "energy-platform-0.5.0"
    app.kubernetes.io/name: energy-platform
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
    energy-platform.io/residency: "CZ"
    energy-platform.io/role: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: energy-platform
      app.kubernetes.io/instance: audit
      energy-platform.io/role: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: energy-platform
        app.kubernetes.io/instance: audit
        energy-platform.io/role: metrics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: audit-energy-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          args:
            - --disable-default-metrics
            - --extend.query-path=/etc/exporter/queries.yaml
            - --web.listen-address=:9187
          env:
            
            - name: ENERGY_PLATFORM_DSN
              valueFrom:
                secretKeyRef:
                  name: audit-energy-platform-pg-app
                  key: uri
            # lib/pq defaults to sslmode=require; the chart's own Postgres speaks plain TCP inside
            # the namespace (NetworkPolicy-scoped), so statefulset mode disables it explicitly.
            - name: DATA_SOURCE_NAME
              value: "$(ENERGY_PLATFORM_DSN)"
          ports:
            - name: metrics
              containerPort: 9187
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: queries
              mountPath: /etc/exporter
              readOnly: true
      volumes:
        - name: queries
          configMap:
            name: audit-energy-platform-metrics-queries

