# Admission: docs/admissions/ote_imbalance_settlement.md (Route A). Settlement version 1 (monthly).
# Only the three admitted metrics; all values retain their published sign and currency.
schema_version: 1
target_id: ote_imbalance_settlement_monthly
description: OTE imbalance settlement, GetImbalanceSettlementPeriodE, monthly version 1 of the previous month (PT15M)
license: "OTE Terms of Use: no reproduction without written consent (docs/06 §1.4); redistribution unconfirmed; repository fixtures are synthetic"
terms_url: https://www.ote-cr.cz/en/documentation/term-of-use
allowed_hosts:
  - www.ote-cr.cz
modality: soap-xml
cadence:
  cron: "27 7 1 * *"         # One run a month, on the 1st: it asks for the whole previous month.
  timezone: Europe/Prague
  correction:
    cron: "47 7 * * *"       # Daily re-poll of that run for 31 days: version 1 of August was out
    days: 31                 # by 23 September (docs/06 §9.1); only days with a run are re-polled.
history:
  max_age: P1Y               # Version 2 of September 2025 was still served on 2026-09-23 (docs/06 §9.1).
fetch:
  soap_xml:
    url: https://www.ote-cr.cz/pw-data/services/PublicDataService
    soap_action: http://www.ote-cr.cz/schema/service/public/GetImbalanceSettlementPeriodE
    soap_version: "1.1"
    body_template: |
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                        xmlns:pub="http://www.ote-cr.cz/schema/service/public">
        <soapenv:Body>
          <pub:GetImbalanceSettlementPeriodE>
            <pub:Version>1</pub:Version>
            <pub:StartDate>{start_date}</pub:StartDate>
            <pub:EndDate>{end_date}</pub:EndDate>
          </pub:GetImbalanceSettlementPeriodE>
        </soapenv:Body>
      </soapenv:Envelope>
    params:
      start_date: "{month_start[1]:%Y-%m-%d}"   # the whole previous month (ADR-033 amendment 1)
      end_date: "{month_end[1]:%Y-%m-%d}"
contract:
  dataset_id: ote.imbalance_settlement
  source_transport: soap
  decode: soap
  metrics: [system_imbalance, imbalance_price, counter_imbalance_price]
mapping:
  dimensions:
    bidding_zone: CZ
  time:
    kind: period_index
    timezone: Europe/Prague
    date: {source: Date}
    index: {source: PeriodIndex}
    resolution: {source: PeriodResolution}
  source_version: {source: Version}
  source_published_at: null
  ignore_fields: [Sum, PositiveImbalance, NegativeImbalance, RoundedImbalance, ReCost, ImbalanceCost, PriceWARE, PriceRE, PriceWAIM, PriceCurve, Emerg]
  metrics:
    system_imbalance: {source: SystemImbalance, unit: MWh, sign: as_published, decimal_separator: dot}
    imbalance_price: {source: SettlImbalancePrice, unit: CZK/MWh, sign: as_published, decimal_separator: dot}
    counter_imbalance_price: {source: SettlCounterImbalancePrice, unit: CZK/MWh, sign: as_published, decimal_separator: dot}
