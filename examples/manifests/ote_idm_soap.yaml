# T1 — OTE continuous intraday market, SOAP GetImPricePeriodE (docs/01-data-scope.md §3).
# System of record for price_vwap and volume_total (01 §3 reconciliation rule 2).
schema_version: 1
target_id: ote_idm_soap
description: OTE continuous intraday market results per delivery period (SOAP, PT15M)
license: "OTE Terms of Use (S09, read 2026-09-19); written reuse confirmation pending (01 §10)"
terms_url: https://www.ote-cr.cz/en/documentation/term-of-use
allowed_hosts:
  - www.ote-cr.cz
modality: soap-xml
cadence:
  cron: "*/15 * * * *"        # 01 §5: 15 min during the delivery day
  timezone: Europe/Prague
history:
  max_age: P2Y                # period-based operation documented from 2024-07-01 (S10); coverage [UNVERIFIED]
fetch:
  soap_xml:
    url: https://www.ote-cr.cz/pw-data/services/PublicDataService
    soap_action: http://www.ote-cr.cz/schema/service/public/GetImPricePeriodE
    soap_version: "1.1"
    body_template: |
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                        xmlns:pub="http://www.ote-cr.cz/schema/service/public">
        <soapenv:Body>
          <pub:GetImPricePeriodE>
            <pub:StartDate>{start_date}</pub:StartDate>
            <pub:EndDate>{end_date}</pub:EndDate>
          </pub:GetImPricePeriodE>
        </soapenv:Body>
      </soapenv:Envelope>
    params:
      start_date: "{delivery_day:%Y-%m-%d}"
      end_date: "{delivery_day:%Y-%m-%d}"     # one delivery day per capture; the API caps at 31
contract:
  dataset_id: ote.idm_continuous
  source_transport: soap
  decode: soap
  metrics: [price_vwap, volume_total]
mapping:
  dimensions:
    bidding_zone: CZ
  time:
    kind: period_index          # 01 §7: index → local interval → UTC
    timezone: Europe/Prague
    date: {source: Date}
    index: {source: PeriodIndex}
    resolution: {source: PeriodResolution}   # PT15M, or PT60M before 2024-07-01
  source_version: null          # the service publishes no revision marker (01 §3)
  source_published_at: null     # no publication timestamp in the response (01 §3)
  metrics:
    price_vwap:
      source: Price
      unit: EUR/MWh
      sign: as_published
      decimal_separator: dot    # S17: dot in the SOAP body
    volume_total:
      source: Volume
      unit: MWh
      decimal_separator: dot
